name: Integridade dos dados
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '15 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconciliar base publicada, cartografia, contexto e história
        run: python scripts/check_all.py
      - name: Comparar totais nacionais e das UFs com arquivos atuais do TSE
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_live_official.py
